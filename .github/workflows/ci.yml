name: CI — Test & Coverage

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Unit & Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci
        env:
          # Provide a dummy API URL so the API client does not throw
          NEXT_PUBLIC_API_URL: ''
          # Disable Next.js telemetry in CI
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload coverage report to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: frontend
          name: agrolink-frontend
          fail_ci_if_error: false

      - name: Upload coverage JSON summary as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Check coverage thresholds
        # Jest is already configured with coverageThreshold; this step makes
        # the threshold failure explicit in the CI summary.
        if: always()
        run: |
          node -e "
            const summary = require('./coverage/coverage-summary.json');
            const total = summary.total;
            const thresholds = { branches: 80, functions: 80, lines: 80, statements: 80 };
            let failed = false;
            for (const [key, min] of Object.entries(thresholds)) {
              const pct = total[key].pct;
              if (pct < min) {
                console.error(\`Coverage threshold not met: \${key} \${pct}% < \${min}%\`);
                failed = true;
              } else {
                console.log(\`\${key}: \${pct}% ✓\`);
              }
            }
            if (failed) process.exit(1);
          "

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
